<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Zoologico animalesco</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>
    <body>
        <h1>Bienvenido</h1>

    <h1>TABLA DE ANIMALES</h1>
    <table id="animals-table">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Especie</th>
                <th>Edad</th>
                <th>Comida favorita</th>
            </tr>
        </thead>
        <tbody>
        {% if error %}
        <tr>
            <td colspan="4">{{ error }}</td>
        </tr>
        {% else %}
        {% for animal in animals %}
        <tr>
            <td>{{ animal.name }}</td>
            <td>{{ animal.species }}</td>
            <td>{{ animal.age }}</td>
            <td>{{ animal.food }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">No hay animales registrados.</td>
        </tr>
        {% endfor %}
        {% endif %}
        </tbody>
    </table>
    <details id="animal-menu">
        <summary id="btn-show-animal-form">
            AGREGAR ANIMAL
        </summary>
        <form id="animal-form">
            <div id="animal-fields">
                <label for="animal-name">Nombre</label>
                <input id="animal-name" name="nombre" type="text">

                <label for="animal-species">Especie</label>
                <input id="animal-species" name="especie" type="text">

                <label for="animal-age">Edad</label>
                <input id="animal-age" name="edad" type="number" min="0">

                <label for="animal-food">Comida favorita</label>
                <input id="animal-food" name="comida_favorita" type="text">

                <button id="btn-add-animal" type="submit">CONFIRMAR</button>
            </div>
        </form>
    </details>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/zoo/agregarAnimal.js') }}"></script>
    </body>
</html>
